services:
  - type: web
    name: finpilot-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finpilot-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: finpilot_session
      - key: SESSION_DAYS
        value: "30"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_CLIENT_ID
        sync: false
      - key: RAZORPAY_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_OAUTH_MODE
        value: test

databases:
  - name: finpilot-postgres
    plan: free
    region: singapore
    databaseName: finpilot
    user: finpilot
    postgresMajorVersion: "18"
    ipAllowList: []
