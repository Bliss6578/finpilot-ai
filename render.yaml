services:
  - type: web
    name: paymentor-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paymentor-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://paymentor-ai.vercel.app
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: paymentor_session
      - key: SESSION_DAYS
        value: "30"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Paymentor <ishita.hustlelab@gmail.com>
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_CLIENT_ID
        sync: false
      - key: RAZORPAY_CLIENT_SECRET
        sync: false
      - key: RAZORPAY_OAUTH_MODE
        value: test

databases:
  - name: paymentor-postgres
    plan: free
    region: singapore
    databaseName: paymentor
    user: paymentor
    postgresMajorVersion: "18"
    ipAllowList: []
